[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-ready-quality-portal"
version = "0.1.0"
description = "Read-only Gradio and MCP interfaces over exported synthetic Databricks quality evidence"
requires-python = ">=3.11"
dependencies = [
  "gradio>=5.0,<7",
  "mcp>=1.28,<2",
]

[tool.setuptools.packages.find]
include = ["quality_portal*"]
